<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripCanvas 导入</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><span>旅</span><div><strong>TripCanvas</strong><small>Google Maps 路线导入</small></div></header>
      <button id="capture" class="primary">捕获当前 Google Maps 地点</button>
      <p id="capture-hint" class="hint">在 Google Maps 打开地点详情页后点击捕获。坐标取自链接，发送前可编辑核对。</p>
      <section>
        <div class="section-title"><strong>路线地点</strong><button id="clear" class="text-button">清空</button></div>
        <ol id="places"></ol>
      </section>
      <label>路线标题 <input id="title" placeholder="例如：涩谷咖啡 City Walk" /></label>
      <label>出行方式 <select id="travel-mode"><option value="walking">步行</option><option value="driving">驾车</option></select></label>
      <button id="send" class="primary">发送到 TripCanvas</button>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
