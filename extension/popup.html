<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripCanvas 创作台</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><span>旅</span><div><strong>TripCanvas</strong><small>地图侧边创作台</small></div></header>
      <section class="hero">
        <p class="canvas-edit-hint">标题、副标题和图片比例请直接在 Google Maps 的蓝色预览框上修改。</p>
        <label>出行方式 <select id="travel-mode"><option value="walking">步行</option><option value="driving">驾车</option></select></label>
        <label>AI 路线想法 <textarea id="ai-prompt" placeholder="例如：涩谷到表参道，咖啡、拍照、买手店，不想走太远"></textarea></label>
        <button id="ai-plan" class="soft" type="button">规划为路径点</button>
        <p class="hint">AI 只会增删和调整下面的路径点；当前先保留接口，接入模型后不会改变编辑方式。</p>
      </section>
      <section class="place-search">
        <div class="section-title"><strong>精确搜索地点</strong><small>Google Places</small></div>
        <div class="search-row">
          <input id="place-query" aria-label="搜索地点" placeholder="输入店名、景点或地址" />
          <button id="search-place" class="soft" type="button">搜索</button>
        </div>
        <div id="place-candidates"></div>
        <p class="hint">从候选中确认后会保存精确坐标、地址和 Place ID；需要先打开本地 TripCanvas。</p>
      </section>
      <button id="capture" class="primary">＋ 添加当前 Google Maps 地点</button>
      <p id="capture-hint" class="hint">打开一个地点详情后添加。标题与比例直接在地图预览框中编辑。</p>
      <section>
        <div class="section-title"><strong>路线地点</strong><button id="clear" class="text-button">清空</button></div>
        <ol id="places"></ol>
        <button id="update-route-preview" class="soft" type="button">更新真实路线预览</button>
        <p id="route-summary" class="route-summary">添加两个路径点后可计算路线。</p>
      </section>
      <div class="sticky-actions">
        <button id="toggle-preview" class="soft" type="button">隐藏地图预览框</button>
        <button id="send" class="primary">生成高清主图与副图</button>
      </div>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
